<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b0f"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#gBg)"/>

  <!-- Title -->
  <text x="500" y="50" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="800" font-size="22" text-anchor="middle">LINForge Pro Protocol Architecture</text>
  <text x="500" y="75" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Automotive Local Interconnect Network (ISO 17987 / LIN 2.2A) Stack</text>

  <!-- Layers -->
  <!-- Layer 7: Application & Signals -->
  <rect x="150" y="110" width="700" height="70" rx="8" fill="#141f2d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="500" y="138" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="15" text-anchor="middle">LIN Application &amp; Signal Mapping Layer</text>
  <text x="500" y="162" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Door Modules | Climate Actuators | Steering Switches | Wipers | Battery Sensors</text>

  <!-- Layer 6: Framing & Transport -->
  <rect x="150" y="200" width="700" height="70" rx="8" fill="#141f2d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="500" y="228" fill="#06b6d4" font-family="Inter, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Frame &amp; Diagnostic Transport Layer</text>
  <text x="500" y="252" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Unconditional Frames (IDs 0..59) | Master Req (0x3C) | Slave Resp (0x3D) | NAD</text>

  <!-- Layer 5: Data Link Layer -->
  <rect x="150" y="290" width="700" height="70" rx="8" fill="#141f2d" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="318" fill="#10b981" font-family="Inter, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Data Link Layer (PID &amp; Integrity)</text>
  <text x="500" y="342" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Protected Identifier (PID P0/P1) | Classic &amp; Enhanced Inverted Carry Checksum</text>

  <!-- Layer 4: Master Scheduling -->
  <rect x="150" y="380" width="700" height="70" rx="8" fill="#141f2d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="410" fill="#f59e0b" font-family="Inter, sans-serif" font-weight="700" font-size="15" text-anchor="middle">Master Schedule Table &amp; Synchronization</text>
  <text x="500" y="432" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Synch Break (>=13 bits) | Synch Byte (0x55 Auto-Baud) | Periodic Slot Timing (10ms/20ms)</text>

  <!-- Layer 3 & Below: Physical Layer -->
  <rect x="150" y="470" width="700" height="60" rx="8" fill="#0b1118" stroke="#475569" stroke-width="1"/>
  <text x="500" y="505" fill="#cbd5e1" font-family="Inter, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Single-Wire 12V Physical Media (ISO 17987-4 / LIN Transceivers)</text>
</svg>