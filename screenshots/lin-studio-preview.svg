<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#111822"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Window Frame -->
  <rect x="30" y="30" width="1140" height="690" rx="14" fill="#0e151f" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="30" y="30" width="1140" height="70" rx="14" fill="#141f2d" stroke="#38bdf8" stroke-opacity="0.2"/>
  <circle cx="65" cy="65" r="7" fill="#f43f5e"/>
  <circle cx="88" cy="65" r="7" fill="#f59e0b"/>
  <circle cx="111" cy="65" r="7" fill="#10b981"/>

  <rect x="150" y="50" width="48" height="30" rx="6" fill="url(#accentGrad)"/>
  <text x="174" y="70" fill="#03141f" font-family="Inter, sans-serif" font-weight="800" font-size="14" text-anchor="middle">LIN</text>

  <text x="215" y="68" fill="#f1f5f9" font-family="Inter, sans-serif" font-weight="700" font-size="18">LINForge Pro</text>
  <text x="360" y="68" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">— Automotive LIN Bus &amp; LDF Protocol Studio</text>

  <!-- Badges -->
  <rect x="880" y="52" width="120" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="940" y="69" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ISO 17987:2016</text>

  <rect x="1015" y="52" width="125" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="1077" y="69" fill="#10b981" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LIN 2.2A / J2602</text>

  <!-- Tab Bar -->
  <rect x="50" y="115" width="150" height="36" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="125" y="138" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Packet Dissector</text>

  <rect x="210" y="115" width="170" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="295" y="138" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Frame &amp; PID Builder</text>

  <rect x="390" y="115" width="180" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="480" y="138" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Diagnostic Transport</text>

  <rect x="580" y="115" width="170" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="665" y="138" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">ISO 21434 Auditor</text>

  <!-- Left Card: Input -->
  <rect x="50" y="170" width="530" height="520" rx="10" fill="#101824" stroke="#38bdf8" stroke-opacity="0.2"/>
  <text x="75" y="205" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="15">Raw UART / LIN Stream</text>

  <rect x="75" y="225" width="480" height="220" rx="8" fill="#070a10" stroke="#38bdf8" stroke-opacity="0.15"/>
  <text x="90" y="255" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="13">55 20 12 85 00 4A FD</text>
  <text x="90" y="285" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">// Sync: 0x55 | PID: 0x20 (ID 32) | 4 Data Bytes | Enhanced CSum: 0xFD</text>

  <rect x="75" y="470" width="140" height="40" rx="8" fill="url(#accentGrad)"/>
  <text x="145" y="495" fill="#03141f" font-family="Inter, sans-serif" font-weight="800" font-size="13" text-anchor="middle">Dissect Frame</text>

  <rect x="230" y="470" width="140" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="300" y="495" fill="#f1f5f9" font-family="Inter, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Export to PCAP</text>

  <!-- Right Card: Dissection Tree -->
  <rect x="610" y="170" width="540" height="520" rx="10" fill="#101824" stroke="#38bdf8" stroke-opacity="0.2"/>
  <text x="635" y="205" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="15">Protocol Dissection Tree</text>

  <rect x="635" y="225" width="490" height="440" rx="8" fill="#070a10" stroke="#38bdf8" stroke-opacity="0.15"/>
  <text x="655" y="255" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-weight="600" font-size="13">&gt; Protocol: LIN (ISO 17987 / LIN 2.2A)</text>
  <text x="675" y="280" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Sync Byte: 0x55 (Valid Synchronization)</text>
  <text x="675" y="300" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">Protected Identifier (PID): 0x20</text>
  <text x="695" y="320" fill="#f1f5f9" font-family="JetBrains Mono, monospace" font-size="12">Frame ID: 32 (0x20) | P0=0, P1=0 [VALID PARITY]</text>

  <text x="655" y="360" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-weight="600" font-size="13">&gt; Data Payload (4 Bytes):</text>
  <text x="675" y="385" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="12">Data Bytes: 12 85 00 4A</text>
  <text x="675" y="405" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Window Position: 18% | Mirror X: 133 | Mirror Y: 0</text>

  <text x="655" y="445" fill="#06b6d4" font-family="JetBrains Mono, monospace" font-weight="600" font-size="13">&gt; Checksum Field:</text>
  <text x="675" y="470" fill="#f1f5f9" font-family="JetBrains Mono, monospace" font-size="12">Received: 0xFD | Expected: 0xFD [VALID CHECKSUM]</text>
  <text x="675" y="490" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">Type: ENHANCED (LIN 2.x / ISO 17987 - includes PID)</text>
</svg>